apiVersion: v1
kind: Agent
metadata:
  name: twitter-marketing-agent
  description: Researches a topic on the web and drafts Twitter/X marketing content (hook, tweet, thread, hashtags, CTA).
  owner: marketing-team
runtime:
  language: python
  version: "3.12"
  builder: auto
  mode: handler
  entrypoint: agents:run
  port: 8080
  health: /health
env:
  - {key: OPENAI_API_KEY}
  - {key: OPENAI_MODEL, value: gpt-4.1-mini}
  - {key: REGION, value: local}
